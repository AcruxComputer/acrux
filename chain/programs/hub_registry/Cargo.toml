[package]
name = "hub_registry"
version = "0.1.0"
description = "Acrux Hub Registry: New Constellation hubs and their members"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "hub_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed", "event-cpi"] }

[lints.rust]
unexpected_cfgs = { level = "allow" }

# Acrux on one Linux host: Acrux Net, the API with its Fault Lab sandboxes, Postgres, and Caddy in
# front with TLS. Run from this folder: docker compose --env-file acrux.env up -d
name: acrux
# Every container's log rotates at 50 MB, five files kept.
x-logging: &logging
  driver: json-file
  options: { max-size: 50m, max-file: "5" }

services:
  postgres:
    logging: *logging
    image: postgres:17-alpine
    container_name: acrux-postgres
    environment: { POSTGRES_USER: acrux, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: acrux }
    volumes: [acrux-pg:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "acrux"], interval: 5s, retries: 20 }
    restart: unless-stopped

  net:
    logging: *logging
    image: acrux-net:${ACRUX_VERSION:-latest}
    build: { context: ../.., dockerfile: deploy/Dockerfile, target: net }
    container_name: acrux-net
    # The net's 50 ms slots come first when the host is busy; lab sandboxes take what is left.
    cpu_shares: 4096
    environment:
      ACRUX_BIND: 0.0.0.0
      ACRUX_PEER_PORT: "${ACRUX_PEER_PORT:-4940}"
      ACRUX_PEER_ADDRESS: "${ACRUX_PEER_ADDRESS:-}"
      ACRUX_TRUST_PROXY: "1"
      ACRUX_CORS_ORIGINS: "${RPC_ORIGINS:-*}"
      ACRUX_RPC_RATE: "${ACRUX_RPC_RATE:-50}"
      ACRUX_SUBMIT_RATE: "${ACRUX_SUBMIT_RATE:-50}"
      ACRUX_WS_PER_IP: "${ACRUX_WS_PER_IP:-8}"
      ACRUX_WS_MAX: "${ACRUX_WS_MAX:-200}"
      ACRUX_TRAFFIC_RATE: "${ACRUX_TRAFFIC_RATE:-50}"
      ACRUX_IDENTITY_SEED: "${ACRUX_IDENTITY_SEED}"
      ACRUX_KEEP_DAYS: "${ACRUX_KEEP_DAYS:-7}"
      ACRUX_KEEP_MAX: "${ACRUX_KEEP_MAX:-200000}"
      ACRUX_LOG_RPC: "${ACRUX_LOG_RPC:-}"
      ACRUX_BRIDGE: "${ACRUX_BRIDGE:-}"
      ACRUX_BRIDGE_RPC: "${ACRUX_BRIDGE_RPC:-}"
      ACRUX_BRIDGE_PROOF_MAX: "${ACRUX_BRIDGE_PROOF_MAX:-100000}"
      ACRUX_BRIDGE_PROOF_GRACE_SLOTS: "${ACRUX_BRIDGE_PROOF_GRACE_SLOTS:-1728000}"
    # One public authenticated QUIC endpoint; validator-to-validator ports stay private.
    ports: ["${ACRUX_PEER_PORT:-4940}:${ACRUX_PEER_PORT:-4940}/udp"]
    # The chain's saved state and kept transactions: a start continues from the last finalized cblock.
    volumes:
      - acrux-net:/var/lib/acrux
      - "${ACRUX_GENESIS_FILE}:/app/chain/genesis/acrux-net.json:ro"
      # The bridge rule's folder: bridge.json there, named by ACRUX_BRIDGE.
      - /etc/acrux/bridge:/etc/acrux/bridge:ro
    restart: unless-stopped

  api:
    logging: *logging
    image: acrux-api:${ACRUX_VERSION:-latest}
    build: { context: ../.., dockerfile: deploy/Dockerfile, target: api }
    container_name: acrux-api
    # The API runs the Fault Lab's sandbox clusters, so it yields CPU to the live net.
    cpu_shares: 512
    depends_on: { postgres: { condition: service_healthy }, net: { condition: service_started } }
    environment:
      MODE: node
      DATABASE_URL: "postgresql://acrux:${POSTGRES_PASSWORD}@postgres:5432/acrux"
      CORS_ORIGINS: "${SITE_ORIGINS}"
      GATEWAY_RPC_URL: http://net:4930
      GATEWAY_INTERNAL_URL: http://net:4989
      SOLANA_RPC_URL: "${SOLANA_RPC_URL}"
      SOLANA_RELAY_RPS: "${SOLANA_RELAY_RPS:-10}"
      ACRUX_MINT: "${ACRUX_MINT:-}"
      BRIDGE_PROGRAM_ID: "${BRIDGE_PROGRAM_ID:-}"
      BRIDGE_FROM_SLOT: "${BRIDGE_FROM_SLOT:-}"
      LAUNCH_WALLET: "${LAUNCH_WALLET:-G9Hx9dH8tNCKdL1FogM2Qsy493Hp6SrG6re1hxkq5aD6}"
      REGISTRY_CLUSTER: "${REGISTRY_CLUSTER:-mainnet-beta}"
      REGISTRY_PROGRAM_ID: "${REGISTRY_PROGRAM_ID}"
      REGISTRY_POLL_SECONDS: "${REGISTRY_POLL_SECONDS:-30}"
      FAUCET_GRANT_LAMPORTS: "${FAUCET_GRANT_LAMPORTS:-2000000000}"
      FAUCET_PER_KEY_LIMIT: "${FAUCET_PER_KEY_LIMIT:-3}"
      FAUCET_PER_IP_LIMIT: "${FAUCET_PER_IP_LIMIT:-10}"
      FAUCET_WINDOW_SECONDS: "${FAUCET_WINDOW_SECONDS:-86400}"
      LAB_RUNS_PER_IP_HOUR: "${LAB_RUNS_PER_IP_HOUR:-6}"
      LAB_QUEUE_MAX: "${LAB_QUEUE_MAX:-10}"
      ACRUX_IDENTITY_SEED: "${ACRUX_IDENTITY_SEED}"
    volumes: ["${ACRUX_GENESIS_FILE}:/app/chain/genesis/acrux-net.json:ro"]
    restart: unless-stopped

  keeper:
    logging: *logging
    image: acrux-api:${ACRUX_VERSION:-latest}
    build: { context: ../.., dockerfile: deploy/Dockerfile, target: api }
    container_name: acrux-keeper
    cpu_shares: 128
    depends_on: { postgres: { condition: service_healthy } }
    env_file: /etc/acrux/acrux.env
    environment:
      DATABASE_URL: "postgresql://acrux:${POSTGRES_PASSWORD}@postgres:5432/acrux"
      LAUNCH_KEYPAIR_FILE: /etc/acrux/launch-keypair.json
      BRIDGE_PROGRAM_ID: "${BRIDGE_PROGRAM_ID:-}"
      GATEWAY_RPC_URL: http://net:4930
      # The relayer reports its saved-proof cursor on the node's private port.
      GATEWAY_INTERNAL_URL: http://net:4989
      BRIDGE_RELAYER_KEYPAIR_FILE: /etc/acrux/bridge-relayer/keypair.json
      BRIDGE_RELAYER_MAX_NEW_WITHDRAWALS_PER_CYCLE: "${BRIDGE_RELAYER_MAX_NEW_WITHDRAWALS_PER_CYCLE:-10}"
      BRIDGE_RELAYER_MAX_RETRY_WITHDRAWALS_PER_CYCLE: "${BRIDGE_RELAYER_MAX_RETRY_WITHDRAWALS_PER_CYCLE:-10}"
    command: ["node", "api/scripts/start-service.mjs", "keeper"]
    volumes:
      - "/etc/acrux/launch-keypair.json:/etc/acrux/launch-keypair.json:ro"
      # The relayer's fee wallet folder: keypair.json there, mode 600.
      - /etc/acrux/bridge-relayer:/etc/acrux/bridge-relayer:ro
    restart: unless-stopped

  caddy:
    logging: *logging
    image: caddy:2
    container_name: acrux-caddy
    depends_on: [net, api]
    ports: ["80:80", "443:443"]
    environment: { ACRUX_DOMAIN: "${ACRUX_DOMAIN}" }
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, acrux-caddy:/data]
    restart: unless-stopped

volumes:
  acrux-pg: { name: acrux-pg }
  acrux-net: { name: acrux-net }
  acrux-caddy: { name: acrux-caddy }
